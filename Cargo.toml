[package]
name = "tui-do-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
libghostty-vt = "0.2.2"
portable-pty = "0.9.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
