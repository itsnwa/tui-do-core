[package]
name = "tui-do-core"
version = "0.2.1"
edition = "2024"
description = "Background service that owns TUI-DO terminal sessions and tasks, and serves them to clients over HTTP + WebSocket"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itsnwa/tui-do-core"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
indexmap = "2.14.2"
libghostty-vt = "0.2.2"
notify = "8"
portable-pty = "0.9.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "transport-streamable-http-server"] }
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "process"] }
tokio-tungstenite = "0.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4"] }
