name: Release

# Builds tui-do-core for each supported platform. Pushing a `v*` tag publishes
# the archives and their SHA-256 sums as a GitHub release (what installing a
# core on another machine downloads); running it by hand only builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Third-party actions are pinned to commits; only the publish job, which uses
# none, can write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15: Zig 0.15.2 can't link its build runner against the macOS 26 SDK
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # libghostty-vt 0.2.x builds Ghostty's VT library with exactly this Zig
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked
      # macOS keeps privacy grants (Local Network, Files & Folders) per code
      # identity. The linker's ad-hoc signature changes with every build, so
      # each update asked again; a Developer ID signature with a fixed
      # identifier stays the same across versions.
      - name: Sign
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            if [ "$IS_TAG" = true ]; then
              echo "::error::MACOS_CERTIFICATE isn't set; a release must be signed"
              exit 1
            fi
            echo "::warning::MACOS_CERTIFICATE isn't set; leaving the binary unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/certificate.p12"
          codesign --force --timestamp --keychain "$keychain" --identifier dev.tui-do.core \
            --sign "Developer ID Application" target/release/tui-do-core
          codesign --verify --strict --verbose=2 target/release/tui-do-core
          codesign -dr - target/release/tui-do-core
          security delete-keychain "$keychain"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="tui-do-core-$TARGET"
          mkdir -p "dist/$name"
          cp target/release/tui-do-core README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
